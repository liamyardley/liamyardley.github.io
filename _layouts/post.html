---
layout: default
---
<article class="wrap prose-wrap">
  <header class="page-head">
    <p class="eyebrow"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>{% if page.tags.size > 0 %} · {{ page.tags | join: ', ' }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">
{{ content }}
  </div>
  <p class="back"><a href="{{ '/writing/' | relative_url }}">← All writing</a></p>
</article>
